version: 2

before:
  hooks:
    # Init the parakeet.cpp submodule and build both static archives before the
    # arm64 cgo build links them (darwin/arm64 only; no-op elsewhere).
    # whisper-lib depends on parakeet-lib, so this one target builds both.
    - git submodule update --init --recursive
    - make whisper-lib
    - packaging/mkicns.sh packaging/appicon.png

builds:
  - id: zee
    env:
      - CGO_ENABLED=1
      # Stamp the macOS 11.0 deploy target so the binary runs on every supported
      # Mac (matches the -mcpu=apple-m1 / deploy target the archives were built with).
      - CGO_CFLAGS=-mmacosx-version-min=11.0
      - CGO_LDFLAGS=-mmacosx-version-min=11.0
      - MACOSX_DEPLOYMENT_TARGET=11.0
    goos:
      - darwin
    goarch:
      - arm64 # Apple Silicon only — local STT (parakeet.cpp) is arm64-only
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - builds:
      - zee
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # A tag carrying a prerelease suffix (v0.4.0-rc.1) publishes as a GitHub
  # prerelease, so it stays out of /releases/latest — which is what both
  # install.sh and the in-app update check resolve. An rc can therefore be
  # tested on a clean machine without moving existing users' "latest".
  prerelease: auto
  github:
    owner: sumerc
    name: zee
